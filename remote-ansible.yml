services:
  setup-app:
    container_name: ansible_setup_app
    build:
      context: .
      dockerfile: ansible.Dockerfile
    command: ansible-playbook -i inventory.ini playbooks/setup-app.yml
  flashcards-update-ssl:
    container_name: ansible_flashcards_update_ssl
    build:
      context: .
      dockerfile: ansible.Dockerfile
    command: ansible-playbook -i inventory.ini playbooks/update-ssl.yml
  flashcards-restarter:
    container_name: ansible_flashcards_restarter
    build:
      context: .
      dockerfile: ansible.Dockerfile
    command: ansible-playbook -i inventory.ini playbooks/setup-restarter.yml